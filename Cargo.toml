[workspace]
resolver = "2"
members = ["crates/mirrorwire-proto", "crates/mirrorwire-media", "crates/mirrorwire-net", "crates/mirrorwire-app", "crates/mirrorwire-android", "crates/mirrorwire-film", "crates/miracast-nm", "crates/miracast-rtsp", "crates/miracast-rtp", "crates/miracast-loopback", "xtask"]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/windwerfer/mirrorwire"
# The binary is distributed as a Flatpak, AppImage or DMG, not as crates.io
# packages. This also lets cargo-deny treat in-tree path deps as private
# (allow-wildcard-paths) rather than as version = "*".
publish = false

# The Android versionCode (major*1_000_000 + minor*1_000 + patch of the version above).
# packaging/android/build-apk.sh derives it again and refuses to build when the two disagree;
# the line exists so F-Droid's UpdateCheckData can read the number (packaging/fdroid/README.md).
[workspace.metadata.android]
version_code = 2002

# Panicking shortcuts are denied outside tests in every product crate (AGENTS.md 1.9;
# clippy.toml allows them in tests). xtask is a dev tool and opts out.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
crossbeam-channel = "0.5"
# Erasure code for video FEC (MIT AND BSD-3-Clause, pure Rust, SIMD with scalar fallback).
reed-solomon-simd = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

[profile.release]
debug = 1

# Android viewer: winit 0.30.13 with one change in platform_impl/android/mod.rs (stylus/mouse
# hover as CursorEntered/Moved/Left; upstream drops it). See vendor/winit/MIRRORWIRE.md.
[patch.crates-io]
winit = { path = "vendor/winit" }
