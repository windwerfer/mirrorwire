name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs-only pushes don't need a build. GitHub never applies path filters
    # to tag pushes, so v* tags always build.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main cancels the older build; tag (release) builds always finish.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  audit:
    name: Audit
    uses: ./.github/workflows/audit.yml

  # CI already scans branch pushes. Tags and manual Build runs would otherwise
  # have no scan, because ci.yml does not run on those events.
  sonarcloud:
    name: SonarCloud
    needs: audit
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    uses: ./.github/workflows/sonarcloud.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # CI / the standalone CodeQL workflow already scan branch pushes. Tags and
  # manual Build runs would otherwise have no scan.
  codeql:
    name: CodeQL
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  macos:
    name: macOS ${{ matrix.arch }}
    needs: audit
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
            min_macos: '11.0'
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            min_macos: '10.13'
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.min_macos }}
      FFMPEG_PREFIX: ${{ github.workspace }}/.ffmpeg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: brew install nasm pkgconf || true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ffmpeg-cache
        with:
          path: .ffmpeg
          key: ffmpeg-${{ matrix.target }}-${{ matrix.min_macos }}-${{ hashFiles('packaging/build-ffmpeg.sh') }}
      - name: Build static FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: packaging/build-ffmpeg.sh "$FFMPEG_PREFIX"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}-${{ matrix.min_macos }}
      - name: Build
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/.ffmpeg/lib/pkgconfig
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            -p mirrorwire-app --no-default-features --features gui,static-ffmpeg
      - name: Smoke test
        run: target/${{ matrix.target }}/release/mirrorwire --version
      # Each slice keeps its own minimum macOS (arm64 11.0, x86_64 10.13); the
      # macos-universal job merges them with lipo into one .app / DMG.
      - name: Stage binary
        run: cp target/${{ matrix.target }}/release/mirrorwire mirrorwire-${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-bin-${{ matrix.arch }}
          path: mirrorwire-${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

  macos-universal:
    name: macOS universal DMG
    needs: macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-bin-*
          path: bin
          merge-multiple: true
      - name: lipo
        run: |
          lipo -create bin/mirrorwire-arm64 bin/mirrorwire-x86_64 -output bin/mirrorwire
          chmod +x bin/mirrorwire
          lipo -info bin/mirrorwire
      - name: Bundle .app and DMG
        id: bundle
        # LSMinimumSystemVersion is the lowest slice (Intel, 10.13); the arm64
        # slice needs 11.0, which every Apple Silicon Mac has anyway.
        run: packaging/macos/bundle.sh bin/mirrorwire universal 10.13 dist
      - name: Smoke test
        run: |
          dist/MirrorWire.app/Contents/MacOS/mirrorwire --version
          arch -x86_64 dist/MirrorWire.app/Contents/MacOS/mirrorwire --version
      # archive: false (upload-artifact v7+) uploads the bare .dmg; the artifact
      # name is the filename, so the Actions download is not wrapped in a zip.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.bundle.outputs.dmg }}
          archive: false
          if-no-files-found: error

  appimage:
    name: Linux AppImage
    needs: audit
    # pipewire-rs 0.10 needs PipeWire >= 1.0 headers; Ubuntu 22.04 ships 0.3.48.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libavdevice-dev \
            clang libclang-dev libva-dev libdrm-dev libpipewire-0.3-dev libspa-0.2-dev libdbus-1-dev \
            libxkbcommon-dev libwayland-dev file
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: appimage
      - name: Build
        # System FFmpeg, linked dynamically (D8): nothing GPL is built or bundled by us.
        run: cargo build --release --locked -p mirrorwire-app --features filmcraft
      - name: Smoke test
        run: target/release/mirrorwire --version && ldd target/release/mirrorwire
      - name: Package AppImage
        run: packaging/appimage/build.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/MirrorWire-x86_64.AppImage
          archive: false
          if-no-files-found: error

  flatpak:
    name: Linux Flatpak
    needs: audit
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image's preinstalled runtimes live in an overlay lower layer; updating or removing
      # them through flatpak fails with "Invalid cross-device link" and flatpak-builder then
      # segfaults. Plain file deletion works on overlayfs, so wipe the system installation and
      # let flatpak-builder install everything fresh into the writable layer.
      - name: Start from an empty Flatpak system installation
        run: |
          rm -rf /var/lib/flatpak/* /var/lib/flatpak/.[!.]* 2>/dev/null || true
          flatpak remote-add --system --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak list --system
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: MirrorWire-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.windwerfer.MirrorWire.yml
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}
          upload-artifact: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: MirrorWire-x86_64.flatpak
          archive: false
          if-no-files-found: error

  android:
    name: Android APK
    needs: audit
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Android SDK packages
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2
      - name: Clippy (Android target)
        run: cargo ndk -t arm64-v8a --platform 26 clippy --release --locked -p mirrorwire-android -- -D warnings
      - name: Release keystore
        # Decoded from secrets so every APK has the same signature and updates install
        # over the old one. Without the secrets (fork PRs) build-apk.sh makes a debug key.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Pasting into the web form can add line breaks, spaces or invisible Unicode
            # whitespace; keep only base64 characters so base64 -d accepts it.
            printf '%s' "$KEYSTORE_BASE64" | LC_ALL=C tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MIRRORWIRE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key"
          else
            echo "MIRRORWIRE_KEYSTORE=$RUNNER_TEMP/mirrorwire-debug.keystore" >> "$GITHUB_ENV"
            echo "::warning::KEYSTORE_BASE64 not set, signing with a throwaway debug key"
          fi
      - name: Build APK
        # versionCode comes from the Cargo version (2002 for 0.2.2), SOURCE_DATE_EPOCH from the
        # commit time; both are computed by build-apk.sh.
        env:
          MIRRORWIRE_KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          MIRRORWIRE_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          MIRRORWIRE_KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: packaging/android/build-apk.sh dist
      - name: Reproducibility check (unsigned rebuild must accept the APK's signature)
        # Same commit, a different target directory; apksigcopier copies the release signature
        # onto the rebuilt unsigned APK and apksigner must verify it (the flow F-Droid uses).
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet apksigcopier==1.1.1
          CARGO_TARGET_DIR="$RUNNER_TEMP/rb-target" MIRRORWIRE_UNSIGNED=1 \
            packaging/android/build-apk.sh "$RUNNER_TEMP/rb-out"
          PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH" "$RUNNER_TEMP/venv/bin/apksigcopier" compare \
            dist/MirrorWire-arm64-v8a.apk --unsigned "$RUNNER_TEMP/rb-out/MirrorWire-arm64-v8a-unsigned.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/MirrorWire-arm64-v8a.apk
          archive: false
          if-no-files-found: error

  # Windows viewer zip (roadmap 7 step 2, D16). LGPL shared FFmpeg DLLs are bundled
  # next to mirrorwire.exe; no GPL parts (no libx264), so the viewer decodes only.
  windows:
    name: Windows viewer
    needs: audit
    runs-on: windows-latest
    env:
      FFMPEG_DIR: ${{ github.workspace }}\\ffmpeg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download FFmpeg (LGPL shared)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-x
          Move-Item (Get-ChildItem ffmpeg-x | Select-Object -First 1).FullName ffmpeg
          "$env:FFMPEG_DIR\bin" | Out-File -Append -Encoding ascii $env:GITHUB_PATH
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows
      - name: Build
        run: cargo build --release --locked -p mirrorwire-app --no-default-features --features gui,ffmpeg
      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/MirrorWire-windows | Out-Null
          Copy-Item target/release/mirrorwire.exe dist/MirrorWire-windows/
          Copy-Item "$env:FFMPEG_DIR\bin\*.dll" dist/MirrorWire-windows/
          Copy-Item LICENSE* dist/MirrorWire-windows/
          Copy-Item "$env:FFMPEG_DIR\LICENSE.txt" dist/MirrorWire-windows/FFmpeg-LICENSE.txt
          Set-Content dist/MirrorWire-windows/README.txt "MirrorWire viewer for Windows. Run mirrorwire.exe. Allow it through the Windows firewall when asked. The DLLs are an unmodified LGPL FFmpeg shared build (BtbN, FFmpeg-LICENSE.txt); source: https://ffmpeg.org and https://github.com/BtbN/FFmpeg-Builds. Presenting from Windows is not supported yet."
          Compress-Archive dist/MirrorWire-windows dist/MirrorWire-windows.zip
      - name: Smoke test
        run: dist/MirrorWire-windows/mirrorwire.exe --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/MirrorWire-windows.zip
          archive: false
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos-universal, appimage, flatpak, android, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: CHANGELOG.md
          persist-credentials: false
      # v8 is required to download artifacts uploaded with archive: false.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          # The Windows artifact is a folder (merge-multiple keeps it as a directory): zip it.
          if [ -d artifacts/MirrorWire-windows ]; then
            (cd artifacts && zip -qr MirrorWire-windows.zip MirrorWire-windows)
            rm -rf artifacts/MirrorWire-windows
          fi
          # Release notes = the matching CHANGELOG.md section (## <version>).
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '/^## /{p=($2==v)} p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $ver"; exit 1; }
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/*.dmg artifacts/*.AppImage artifacts/*.flatpak artifacts/*.apk artifacts/*.zip \
            --repo "${GITHUB_REPOSITORY}" --title "MirrorWire ${GITHUB_REF_NAME}" --notes-file notes.md
