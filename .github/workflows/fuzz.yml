name: Fuzz + ASan

# Nightly Rust is used ONLY here (decisions.md D18). Normal CI, builds and releases are stable.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# rust-toolchain.toml pins the repo to stable 1.100.0, and rustup prefers that pin over the
# default toolchain, so plain `cargo` here would run 1.100.0 and reject -Zsanitizer / cargo-fuzz.
# RUSTUP_TOOLCHAIN overrides the pin for every step of both jobs (nightly only here, D18).
env:
  RUSTUP_TOOLCHAIN: nightly

jobs:
  asan:
    name: AddressSanitizer (media tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavdevice-dev \
            libavfilter-dev libswresample-dev libpipewire-0.3-dev libspa-0.2-dev libva-dev \
            libdbus-1-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
      - name: Show compiler
        run: rustc -vV
      - name: Media + film tests under AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: cargo test -p mirrorwire-media -p mirrorwire-film --locked --lib --tests --target x86_64-unknown-linux-gnu

  fuzz:
    name: cargo-fuzz (60 s per target)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
      - name: Show compiler
        run: rustc -vV
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz wire parsers
        working-directory: fuzz
        run: |
          for t in proto_parse reassembler; do
            cargo fuzz run "$t" -- -max_total_time=60
          done
      # Known upstream finding (2026-11-18): craft-libs h264 decoder.rs:532 "attempt to subtract
      # with overflow" (overflow checks are on in fuzz builds; release wraps, and the adapter
      # catches panics). Reported, not blocking until FilmCraft fixes it; drop continue-on-error then.
      - name: Fuzz FilmCraft H.264 decoder
        working-directory: fuzz
        continue-on-error: true
        run: cargo fuzz run film_decode -- -max_total_time=60
      - name: Upload crashes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
