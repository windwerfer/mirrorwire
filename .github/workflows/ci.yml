name: CI

on:
  # Docs-only changes skip this workflow.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE*'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit
    uses: ./.github/workflows/audit.yml

  sonarcloud:
    name: SonarCloud
    needs: audit
    permissions:
      contents: read
    uses: ./.github/workflows/sonarcloud.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Windows viewer build check (roadmap 7, D16). FFmpeg: shared GPL build for CI tests only (needs libx264); release builds will use LGPL.
  windows:
    name: Check (Windows)
    runs-on: windows-latest
    env:
      FFMPEG_DIR: ${{ github.workspace }}\\ffmpeg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Download FFmpeg (GPL shared, CI-only, has libx264)"
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-x
          Move-Item (Get-ChildItem ffmpeg-x | Select-Object -First 1).FullName ffmpeg
          "$env:FFMPEG_DIR\bin" | Out-File -Append -Encoding ascii $env:GITHUB_PATH
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --exclude mirrorwire-android --all-targets --locked --no-default-features --features mirrorwire-app/gui,mirrorwire-app/ffmpeg -- -D warnings
      # CI-only GPL build because the tests need libx264; nothing from it is distributed.
      - run: cargo test --workspace --exclude mirrorwire-android --locked --no-default-features --features mirrorwire-app/gui,mirrorwire-app/ffmpeg

  test:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavdevice-dev \
            libavfilter-dev libswresample-dev libpipewire-0.3-dev libspa-0.2-dev libva-dev \
            libdbus-1-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo xtask layers
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Loopback test (test pattern -> QUIC -> headless viewer)
        run: cargo xtask loopback 5
      # Optional pure-Rust FilmCraft encoder (cargo feature `filmcraft`).
      - run: cargo clippy -p mirrorwire-media -p mirrorwire-app --all-targets --locked --features mirrorwire-app/filmcraft -- -D warnings
      - run: cargo test -p mirrorwire-media --locked --features filmcraft
      # FFmpeg-free build (D17): FilmCraft only, no libav* linked.
      - run: cargo clippy -p mirrorwire-media -p mirrorwire-app --all-targets --locked --no-default-features --features mirrorwire-app/gui,mirrorwire-app/filmcraft -- -D warnings
      - run: cargo test -p mirrorwire-media --locked --no-default-features --features filmcraft
      - name: Loopback test with FilmCraft
        run: MIRRORWIRE_FEATURES=filmcraft scripts/loopback-test.sh 5 --encoder filmcraft
