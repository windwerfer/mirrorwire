[package]
name = "mirrorwire-media"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["ffmpeg"]
# FFmpeg (libx264/VAAPI/VideoToolbox encode, hardware decode, swscale). Off = pure-Rust build:
# FilmCraft encoder + decoder only (decisions D17).
ffmpeg = ["dep:ffmpeg-next"]
portal = ["dep:ashpd", "dep:pipewire"]
static-ffmpeg = ["ffmpeg", "ffmpeg-next/static"]
# Pure-Rust FilmCraft H.264 encoder as an optional presenter backend (`--encoder filmcraft`).
filmcraft = ["dep:craft-video"]

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
crossbeam-channel.workspace = true
tracing.workspace = true
ffmpeg-next = { version = "9", optional = true }
mirrorwire-proto = { path = "../mirrorwire-proto" }
# FilmCraft's pure-Rust H.264 decoder: the software decoder on Linux and Windows (decision log
# 2026-11-15). The craft-video pin lives in mirrorwire-film.
mirrorwire-film = { path = "../mirrorwire-film" }
# FilmCraft's pure-Rust H.264 encoder, now in craft-libs (`craft-video`, feature `h264-encode`,
# decision D23). Not on crates.io; same craft-libs rev as mirrorwire-film so the workspace
# builds one copy (docs/agents/filmcraft.md).
craft-video = { git = "https://github.com/storytold/craft-libs", rev = "068e079c7be4b100a8a6b305b31ac881e069727e", default-features = false, features = ["h264-encode", "threads"], optional = true }

# tokio: the FrameSource remote-input channel (all platforms), fs for portal tokens (Linux).
tokio = { workspace = true, features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", optional = true, default-features = false, features = ["tokio", "screencast", "remote_desktop", "camera"] }
pipewire = { version = "0.10", optional = true }
