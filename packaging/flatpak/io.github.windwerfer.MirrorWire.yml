id: io.github.windwerfer.MirrorWire
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
command: mirrorwire
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --device=dri
  # Query / open the presenter UDP port via firewalld (polkit prompt). No host
  # filesystem and no generic --talk-name; the three system-bus names below are the only
  # extra D-Bus names.
  - --system-talk-name=org.fedoraproject.FirewallD1
  # Receiving from Android (Miracast-compatible) needs NetworkManager's Wi-Fi P2P D-Bus API:
  # discovery, the volatile wifi-p2p profile and its IP config. There is no portal for it.
  # Only this one name; NM's Polkit rules still decide what the call may do (D24).
  - --system-talk-name=org.freedesktop.NetworkManager
  # Read-only: hostname1's PrettyHostname/StaticHostname, the estimate of the name Android
  # lists for this computer on the Miracast screen (D25; owner-approved 2026-11-22).
  - --system-talk-name=org.freedesktop.hostname1
# FFmpeg is not built or bundled (D8): the runtime's libav* is used at build time and the
# ffmpeg-full extension (libx264, VA-API encoders) replaces it at run time.
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '25.08'
    add-ld-path: .
    autodownload: true
    autodelete: false
cleanup-commands:
  - mkdir -p ${FLATPAK_DEST}/lib/ffmpeg
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
  env:
    LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - '*.a'
modules:
  - name: mirrorwire
    buildsystem: simple
    build-options:
      # Cargo fetches crates during the build. Fine for CI bundles; a Flathub
      # submission would vendor them with flatpak-cargo-generator instead.
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/mirrorwire/cargo
    build-commands:
      - cargo build --release --locked -p mirrorwire-app --features filmcraft
      - install -Dm755 target/release/mirrorwire /app/bin/mirrorwire
      - install -Dm644 packaging/linux/io.github.windwerfer.MirrorWire.desktop /app/share/applications/io.github.windwerfer.MirrorWire.desktop
      - install -Dm644 packaging/linux/io.github.windwerfer.MirrorWire.metainfo.xml /app/share/metainfo/io.github.windwerfer.MirrorWire.metainfo.xml
      - install -Dm644 packaging/icons/io.github.windwerfer.MirrorWire.png /app/share/icons/hicolor/512x512/apps/io.github.windwerfer.MirrorWire.png
      - install -Dm644 packaging/linux/mirrorwire.xml /app/share/firewalld/services/mirrorwire.xml
      - install -Dm644 packaging/linux/README-firewalld.md /app/share/doc/mirrorwire/README-firewalld.md
    sources:
      - type: dir
        path: ../..
        skip:
          - target
